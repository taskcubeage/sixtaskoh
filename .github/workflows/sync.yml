name: Sync Team Development to Company

on:
  push:
    branches:
      - development

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Push to Company Repository
        env:
          TOKEN: ${{ secrets.COMPANY_PAT }}
        run: |
          git remote add company https://x-access-token:${TOKEN}@github.com/OmkarHasure/sixtaskoh.git
          git push company development